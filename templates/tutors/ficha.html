{% extends "tenancy/base_panel.html" %}
{% load i18n %}

{% block title %}{{ tutor.nombre }}{% endblock %}

{% block panel %}
  <h1>{{ tutor.nombre }}</h1>

  <p>
    <span>{% translate "Teléfono" %}:</span>
    <strong>{{ tutor.telefono|default:"—" }}</strong>
  </p>

  <p><a href="{% url 'tutors:lista' %}">{% translate "Volver a Tutores" %}</a></p>
{% endblock %}
